    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const root = document.querySelector('[data-composition-id="03-discover-switch-manage"]') || document;
        const q = (s) => root.querySelector(s);
        const qa = (s) => Array.from(root.querySelectorAll(s));
        const tl = gsap.timeline({ paused: true });

        const INK = "#F1F5F9", DIM = "#475569", MUTED = "#94A3B8";
        const v1 = q("#f03-v1"), v2 = q("#f03-v2"), v3 = q("#f03-v3");
        const panel = q("#f03-panel");
        const rows = qa(".f03-row");
        const chips = qa(".f03-chip");
        const cap1 = q("#f03-cap1"), cap2 = q("#f03-cap2"), cap3 = q("#f03-cap3");
        const cursor = q("#f03-cursor");
        const rings = [q("#f03-ring1"), q("#f03-ring2")];

        // Initial states for hard-cut / later-revealed pieces (seek-safe: set at t=0).
        tl.set([cap1, cap2, cap3, cursor, q("#f03-hl"), q("#f03-live"), q("#f03-kc")], { opacity: 0 }, 0);
        tl.set(rings, { opacity: 0, scale: 0 }, 0);
        tl.set(rows[0], { color: INK }, 0);
        tl.set(panel, { transformOrigin: "50% 50%" }, 0);
        tl.set(cursor, { transformOrigin: "2px 2px" }, 0);

        // ── Scene 1 (0.0–0.5s): verb column rises in, all dim — per-word stagger ──
        tl.fromTo([v1, v2, v3], { y: 56, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.07 }, 0);

        // ── Scene 2 (0.5–2.2s): Discover lights; three KUBECONFIG paths burst out, then merge into one panel ──
        tl.to(v1, { color: INK, duration: 0.25, ease: "power1.out" }, 0.5);
        tl.fromTo(q("#f03-kc"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, 0.6);

        // center-outward-expansion: shared origin = panel centre (1390,464); targets = stacked offsets.
        const EXPAND_AT = 0.58, STAGGER = 0.07, EXPAND_DUR = 0.55;
        chips.forEach((el, i) => {
          tl.fromTo(el, { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.6, opacity: 0 },
            { x: Number(el.dataset.targetX), y: Number(el.dataset.targetY), scale: 1, opacity: 1,
              duration: EXPAND_DUR, ease: "power3.out" }, EXPAND_AT + i * STAGGER);
        });

        // Merge: chips slide together into the panel header ("3 kubeconfig files") as the panel forms.
        const MERGE_AT = 1.3, MERGE_DUR = 0.5;
        tl.to(chips, { x: -190, y: -200, scale: 0.5, opacity: 0, duration: MERGE_DUR, ease: "power2.inOut", stagger: 0.04 }, MERGE_AT);
        tl.to(q("#f03-kc"), { opacity: 0, y: -10, duration: 0.3, ease: "power1.in" }, MERGE_AT);
        tl.fromTo(panel, { scale: 0.92, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.55, ease: "power2.out" }, MERGE_AT + 0.12);
        tl.fromTo(rows, { x: -16, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.35, ease: "power2.out", stagger: 0.06 }, 1.55);
        tl.fromTo([q("#f03-hl"), q("#f03-live")], { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power1.out", immediateRender: false }, 1.85);
        tl.fromTo(cap1, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, 1.8);

        // ── Scene 3 (2.2–4.0s): Switch lights; pointer glides to staging, clicks; live dot + highlight move ──
        tl.to(v1, { color: DIM, duration: 0.25, ease: "power1.out" }, 2.2);
        tl.to(v2, { color: INK, duration: 0.25, ease: "power1.out" }, 2.2);
        // discrete-text-sequence: instant caption swap at the threshold.
        tl.set(cap1, { opacity: 0 }, 2.2);
        tl.set(cap2, { opacity: 1, y: 0 }, 2.2);

        // cursor-click-ripple — move (eased), click (press + release), ripple from the cursor tip (1562,420).
        tl.fromTo(cursor, { opacity: 0 },
          { opacity: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, 2.3);
        tl.fromTo(cursor, { x: 170, y: 250 },
          { x: 0, y: 0, duration: 0.7, ease: "power2.inOut", immediateRender: false }, 2.35);
        const CLICK_AT = 3.2, PRESS = 0.08;
        tl.to(cursor, { scale: 0.85, duration: PRESS, ease: "power2.in" }, CLICK_AT);
        tl.to(cursor, { scale: 1, duration: PRESS, ease: "power2.out" }, CLICK_AT + PRESS);
        tl.to(rows[1], { scale: 0.98, duration: PRESS, ease: "power2.in" }, CLICK_AT);
        tl.to(rows[1], { scale: 1, duration: PRESS, ease: "power2.out" }, CLICK_AT + PRESS);
        rings.forEach((r, i) => {
          tl.fromTo(r, { scale: 0, opacity: 0.9 },
            { scale: 3.5, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, CLICK_AT + 0.02 + i * 0.09);
        });
        // Active state moves prod-eu-west-1 → staging.
        const SWITCH_AT = CLICK_AT + 0.06;
        tl.to([q("#f03-hl"), q("#f03-live")], { y: 80, duration: 0.35, ease: "power3.out" }, SWITCH_AT);
        tl.to(rows[0], { color: MUTED, duration: 0.2, ease: "power1.out" }, SWITCH_AT);
        tl.to(rows[1], { color: INK, duration: 0.2, ease: "power1.out" }, SWITCH_AT);

        // ── Scene 4 (4.0–6.0s): Manage lights; panel scales down and docks into the menu-bar dropdown ──
        tl.to(v2, { color: DIM, duration: 0.25, ease: "power1.out" }, 4.0);
        tl.to(v3, { color: INK, duration: 0.25, ease: "power1.out" }, 4.0);
        tl.set(cap2, { opacity: 0 }, 4.0);
        tl.to(cursor, { opacity: 0, duration: 0.2, ease: "power1.in" }, 4.0);

        // Menu-bar strip arrives above; the cube glyph pops in.
        tl.fromTo(q("#f03-strip"), { opacity: 0, y: -16 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.1);
        tl.fromTo(q("#f03-glyph"), { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 4.4);

        // card-morph-anchor: one tween, uniform scale + paint channel; lands top-right under the glyph.
        const MORPH_AT = 4.05, MORPH_DUR = 0.9, END_SCALE = 440 / 820;
        tl.set(panel, { transformOrigin: "100% 0%" }, 4.0);
        tl.to(panel, { scale: END_SCALE, x: -40, y: 70, borderRadius: 10 / END_SCALE,
          duration: MORPH_DUR, ease: "power2.inOut" }, MORPH_AT);
        tl.to(q("#f03-old"), { opacity: 0, duration: MORPH_DUR * 0.4, ease: "power1.in" }, MORPH_AT);
        tl.fromTo(q("#f03-new"), { opacity: 0 },
          { opacity: 1, duration: MORPH_DUR * 0.4, ease: "power1.out" }, MORPH_AT + MORPH_DUR * 0.6);
        // Caption hard-cuts in once the dropdown has cleared its slot.
        tl.set(cap3, { opacity: 1 }, 4.85);

        // Emphasis beat: all three verbs lit for the final 0.6s hold.
        tl.to([v1, v2], { color: INK, duration: 0.2, ease: "power1.out" }, 5.4);
        tl.set({}, {}, 6);

        window.__timelines["03-discover-switch-manage"] = tl;
