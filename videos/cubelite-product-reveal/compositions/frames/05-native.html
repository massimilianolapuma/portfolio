    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        window.__timelines["05-native"] = tl;

        const root = document.querySelector('[data-composition-id="05-native"]') || document;
        const q = (sel, el) => Array.from((el || root).querySelectorAll(sel));

        // Scene 1 (0.0–1.0s): headline rises, per-word stagger.
        tl.fromTo(q(".f05-word"),
          { y: 56, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.11 }, 0.05);

        // Card self-assemble (grid-card-assemble cascade): rise from below, border draws,
        // fill fades, accent top edge sweeps left→right.
        function assemble(card, t) {
          tl.fromTo(card, { y: 48 }, { y: 0, duration: 0.7, ease: "power3.out" }, t);
          tl.fromTo(card.querySelector(".f05-edge rect"),
            { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.65, ease: "power2.inOut" }, t);
          tl.fromTo(card.querySelector(".f05-fill"),
            { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, t + 0.12);
          const accent = card.querySelector(".f05-accent");
          if (accent) {
            tl.fromTo(accent, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, t + 0.3);
          }
        }

        // dynamic-content-sequencing: reveal starts are pre-computed ONCE from each line's
        // content length (longer copy earns more lead time), then fitted into the scene window.
        const BASE_GAP = 0.1, SEC_PER_CHAR = 0.004;
        function sequence(card, from, lastStart) {
          const items = q(".f05-seq", card);
          let cumulative = 0;
          const raw = items.map((el) => {
            const start = cumulative;
            cumulative += BASE_GAP + el.textContent.trim().length * SEC_PER_CHAR;
            return start;
          });
          const span = raw[raw.length - 1] || 1;
          const k = (lastStart - from) / span;
          items.forEach((el, i) => {
            const isPill = el.classList.contains("f05-pill");
            tl.fromTo(el,
              isPill ? { opacity: 0, scale: 0.86 } : { opacity: 0, y: 18 },
              isPill
                ? { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }
                : { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
              from + raw[i] * k);
          });
        }

        // Scene 2 (1.0–2.4s): macOS card, then its lines in order.
        const mac = root.querySelector("#f05-card-mac");
        assemble(mac, 1.0);
        sequence(mac, 1.35, 2.0);

        // Scene 3 (2.4–3.6s): Desktop card to the right; pill, Tauri v2, then OS names one by one.
        const desk = root.querySelector("#f05-card-desk");
        assemble(desk, 2.4);
        sequence(desk, 2.72, 3.25);

        // Scene 4 (3.6–5.0s): held two-card read, still. Pad the timeline to the full 5s.
        tl.set({}, {}, 5);
      })();
