    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const root = document.querySelector('[data-composition-id="02-one-interface"]') || document;
        const q = (s) => root.querySelector(s);
        const qa = (s) => Array.from(root.querySelectorAll(s));
        const tl = gsap.timeline({ paused: true });

        // ── Scene 1 (0.0–1.4s): point opens into the hub; nodes order themselves; connectors draw ──
        // Handoff: 28px ink-soft point at (960,540), scale 1, opacity 1 at t=0.
        tl.fromTo("#f02-seed", { scale: 1, opacity: 1 },
          { scale: 2.2, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.08);

        // Hub ellipse grows out of the point while its stroke self-draws (svg-path-draw, pathLength=1).
        const hub = q("#f02-hub");
        tl.fromTo(hub, { attr: { rx: 14, ry: 14, cy: 540 } },
          { attr: { rx: 520, ry: 175, cy: 560 }, duration: 1.0, ease: "power3.inOut" }, 0);
        tl.fromTo(hub, { attr: { "stroke-dashoffset": 1 } },
          { attr: { "stroke-dashoffset": 0 }, duration: 1.0, ease: "power2.out" }, 0.05);
        tl.fromTo(hub, { attr: { "stroke-opacity": 0.9 } },
          { attr: { "stroke-opacity": 0.25 }, duration: 0.8, ease: "power1.out" }, 0.6);

        // Loose (chaotic) offsets each node slides in from — deterministic, clockwise order.
        const loose = [
          [-90, 70, -5], [60, -80, 4], [-70, -60, -3], [110, 50, 6],
          [70, -70, -4], [-80, 70, 4], [90, 60, -6], [-60, -90, 3],
        ];
        const nodes = qa(".f02-node");
        const conns = qa(".f02-conn");
        const NODE_AT = 0.3, STAGGER = 0.06, SLIDE = 0.8;
        nodes.forEach((el, i) => {
          const [dx, dy, rot] = loose[i];
          const at = NODE_AT + i * STAGGER;
          tl.fromTo(el, { x: dx, y: dy, rotation: rot },
            { x: 0, y: 0, rotation: 0, duration: SLIDE, ease: "power3.out" }, at);
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, at);
          // Connector origin rides with its node; the stroke draws node -> hub edge.
          const line = conns[i];
          const x1 = parseFloat(line.getAttribute("x1"));
          const y1 = parseFloat(line.getAttribute("y1"));
          // One attr tween per line (two overlapping attr tweens fight over the same plugin).
          tl.fromTo(line, { attr: { x1: x1 + dx, y1: y1 + dy, "stroke-dashoffset": 1 } },
            { attr: { x1: x1, y1: y1, "stroke-dashoffset": 0 }, duration: SLIDE, ease: "power3.out" }, at);
        });

        // ── Scene 2 (1.4–2.6s): headline rises word by word; connectors start a slow dash-flow ──
        tl.fromTo(".f02-word", { y: 44, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power3.out", stagger: 0.12 }, 1.4);

        tl.fromTo("#f02-flow", { opacity: 0 }, { opacity: 0.55, duration: 0.6, ease: "power1.out" }, 1.5);
        // Decreasing dashoffset moves dashes toward x2/y2 = the hub. Linear, low speed, runs to the end.
        tl.fromTo(".f02-flowline", { attr: { "stroke-dashoffset": 0 } },
          { attr: { "stroke-dashoffset": -0.56 }, duration: 3.5, ease: "none" }, 1.5);

        // ── Scene 3 (2.6–3.6s): icon arrives (no upscale), wordmark wipes L->R, tagline fades up ──
        tl.fromTo("#f02-icon", { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 2.6);
        tl.fromTo("#f02-wordmark", { clipPath: "inset(-20% 100% -20% 0%)" },
          { clipPath: "inset(-20% 0% -20% 0%)", duration: 0.6, ease: "power2.out" }, 2.75);
        tl.fromTo("#f02-tag", { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 3.15);

        // ── Scene 4 (3.6–5.0s): held lockup; only the dash-flow keeps moving (tween above runs to 5.0) ──
        tl.set({}, {}, 5);

        window.__timelines["02-one-interface"] = tl;
      })();
    </script>
