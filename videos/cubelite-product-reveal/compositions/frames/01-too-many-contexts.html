    <script>
      (function () {
        const FRAME = "01-too-many-contexts";
        const root = document.querySelector('[data-composition-id="' + FRAME + '"]');
        const q = (sel) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
        const tl = gsap.timeline({ paused: true });

        const CX = 960, CY = 540;
        // Deterministic chip geometry: JetBrains Mono advance 0.6em @26px, + padding/dot/border.
        const CHIP_H = 62;
        const chipW = (el) => el.textContent.length * 15.6 + 40 + 22 + 2;
        // Deterministic pseudo-random in [-1, 1] from the chip index.
        const prand = (i, k) => { const s = Math.sin((i + 1) * 12.9898 + k * 78.233) * 43758.5453; return (s - Math.floor(s)) * 2 - 1; };

        const chips = q(".f01-chip").map((el, i) => {
          const left = parseFloat(el.style.left), top = parseFloat(el.style.top);
          const cx = left + chipW(el) / 2, cy = top + CHIP_H / 2;
          const vx = cx - CX, vy = cy - CY;
          const len = Math.max(1, Math.hypot(vx, vy));
          const back = el.dataset.depth === "back";
          return { el, i, rot: Number(el.dataset.rot), back,
            nx: vx / len, ny: vy / len, toX: CX - cx, toY: CY - cy, dist: len,
            restScale: back ? 0.84 : 1, restOpacity: back ? 0.55 : 1 };
        });

        // ── Scene 1 (0.0–1.1s): chips drift in from every edge (center-outward expansion run in reverse:
        // they travel inward along their radial line from off-frame to the scattered rest). Back layer
        // travels less, arrives a touch later, smaller + dimmer → layered depth.
        const entryOrder = chips.slice().sort((a, b) => (a.back - b.back) || (b.dist - a.dist));
        entryOrder.forEach((c, k) => {
          const travel = c.back ? 620 : 1050;
          tl.fromTo(c.el,
            { x: c.nx * travel, y: c.ny * travel, rotation: c.rot * 4, scale: c.restScale * 0.9, opacity: 0 },
            { x: 0, y: 0, rotation: c.rot, scale: c.restScale, opacity: c.restOpacity, duration: 0.66, ease: "power3.out" },
            0.04 + k * 0.026);
        });

        // ── Scene 2 (1.1–2.6s): headline rises word-group by word-group; chips dim back and keep a barely-there jitter.
        const groupAt = [1.12, 1.42, 1.74];
        q(".f01-word").forEach((w, j) => {
          const g = Number(w.dataset.group);
          tl.fromTo(w,
            { y: 80, opacity: 0, filter: "blur(10px)" },
            { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.62, ease: "power3.out" },
            groupAt[g] + (g === 0 ? j * 0.07 : 0));
        });
        chips.forEach((c) => {
          tl.to(c.el, { opacity: c.back ? 0.32 : 0.62, duration: 0.5, ease: "power2.out" }, 1.14);
          tl.to(c.el, {
            x: prand(c.i, 1) * 5, y: prand(c.i, 2) * 4, rotation: c.rot + prand(c.i, 3) * 0.7,
            duration: 1.46, ease: "sine.inOut" }, 1.14);
        });

        // ── Scene 3 (2.6–3.4s): headline holds; chips accelerate to center along straight paths, shrinking + fading
        // (center-outward expansion inverted: cluster inward). Far chips leave first so all arrive together.
        const convergeOrder = chips.slice().sort((a, b) => b.dist - a.dist);
        convergeOrder.forEach((c, k) => {
          const at = 2.6 + k * 0.01;
          tl.to(c.el, { x: c.toX, y: c.toY, rotation: 0, scale: 0.18, duration: 0.66, ease: "power3.in" }, at);
          tl.to(c.el, { opacity: 0, duration: 0.3, ease: "power1.in" }, at + 0.36);
        });

        // ── Scene 4 (3.4–4.0s): scale-swap — headline (outgoing) rushes up and out with power2.in while the
        // blue point (incoming) settles in at exact center with power3.out, overlapping the exit; holds for the cut.
        tl.to("#f01-headline", { y: -46, scale: 0.94, opacity: 0, duration: 0.3, ease: "power2.in" }, 3.36);
        tl.fromTo("#f01-point",
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
          3.36 + 0.3 - 0.18); // lands at 3.90s, static scale 1 / opacity 1 through the cut

        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME] = tl;
      })();
