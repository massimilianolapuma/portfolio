    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Measured geometry (analytic, deterministic): rounded-rect perimeter, key glyph, line segments.
        const R = 27, W = 622, H = 702;
        const PERIM_LEN = (2 * (W - 2 * R) + 2 * (H - 2 * R) + 2 * Math.PI * R) * 1.02;
        const RING_LEN = 2 * Math.PI * 7 * 1.05;
        const BIT_LEN = (13 + 6 + 5) * 1.05;
        const IN_LEN = 61, OUT_LEN = 69, X_LEN = Math.hypot(24, 30) * 1.05;

        const draw = (sel, len, dur, ease, at) =>
          tl.fromTo(sel, { strokeDasharray: len, strokeDashoffset: len },
            { strokeDashoffset: 0, duration: dur, ease: ease }, at);

        // ── Scene 1 (0.0–1.2s): headline per-word rise; perimeter draws; label fades in ──
        tl.fromTo(["#f04-w1", "#f04-w2", "#f04-w3"],
          { y: 46, opacity: 0, filter: "blur(8px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out", stagger: 0.13 }, 0.1);
        draw("#f04-perim-draw", PERIM_LEN, 1.0, "power2.out", 0.15);
        tl.fromTo("#f04-perim-label", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.45, ease: "power1.out" }, 0.65);

        // ── Scene 2 (1.2–3.0s): Keychain panel + key glyph; credential rows slide in from the perimeter edge ──
        tl.fromTo("#f04-keychain", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 1.2);
        draw("#f04-key-ring", RING_LEN, 0.35, "power2.out", 1.3);
        draw("#f04-key-bit", BIT_LEN, 0.3, "power2.out", 1.56);
        tl.fromTo("#f04-sub", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 1.55);

        // dynamic-content-sequencing: each row's slot = BASE + chars × SEC_PER_CHAR, pre-computed once.
        const ROWS = [
          { sel: "#f04-row1", text: "client-cert · prod-eu-west-1" },
          { sel: "#f04-row2", text: "bearer-token · staging" },
          { sel: "#f04-row3", text: "client-cert · dev-local" },
        ];
        const BASE = 0.25, SEC_PER_CHAR = 0.006;
        let cursor = 1.5;
        const ROW_TIMELINE = ROWS.map((r) => {
          const start = cursor;
          cursor += BASE + r.text.length * SEC_PER_CHAR;
          return { sel: r.sel, start: start };
        });
        ROW_TIMELINE.forEach((r) => {
          tl.fromTo(r.sel, { x: -84, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, r.start);
        });

        // ── Scene 3 (3.0–4.6s): lines run toward "cloud", get cut at the perimeter, ✕ stamps, outside fades ──
        tl.fromTo("#f04-cloud", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 2.75);
        const LINES = [
          { inn: "#f04-in1-draw", out: "#f04-out1-draw", xa: "#f04-x1a", xb: "#f04-x1b", at: 3.0 },
          { inn: "#f04-in2-draw", out: "#f04-out2-draw", xa: "#f04-x2a", xb: "#f04-x2b", at: 3.18 },
        ];
        LINES.forEach((l) => {
          draw(l.inn, IN_LEN, 0.4, "none", l.at);
          draw(l.out, OUT_LEN, 0.42, "none", l.at + 0.4);
          // cross stamp: forward stroke first, backward follows
          draw(l.xa, X_LEN, 0.16, "power2.out", l.at + 0.52);
          draw(l.xb, X_LEN, 0.16, "power2.out", l.at + 0.62);
        });
        tl.fromTo("#f04-outside", { opacity: 1 }, { opacity: 0.2, duration: 0.6, ease: "power1.out" }, 3.95);

        // ── Scene 4 (4.6–6.0s): the two negations land on one beat grid, smooth register, then hold ──
        const BEATS = [4.6, 5.15];
        tl.fromTo("#f04-neg1",
          { opacity: 0, scale: 1.12, filter: "blur(10px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, BEATS[0]);
        tl.fromTo("#f04-neg2",
          { opacity: 0, x: -60 },
          { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, BEATS[1]);

        window.__timelines["04-local-first"] = tl;
      })();
