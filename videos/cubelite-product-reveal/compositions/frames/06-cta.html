    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        window.__timelines["06-cta"] = tl;
        const TOTAL = 4;

        // ── Scene 1 (0.0–0.9s): icon pops/rises in, wordmark reveals left→right beside it.
        // spring-pop-entrance, calm settle: scale 0→1 + small rise, power3.out, no overshoot.
        tl.fromTo("#f06-icon",
          { scale: 0, opacity: 0, y: 12 },
          { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.05);
        // Wordmark: clip-path wipe from the icon side outward (left→right), with a slight trailing drift.
        tl.fromTo("#f06-word",
          { clipPath: "inset(-12% 100% -12% 0%)", x: -18, opacity: 0.4 },
          { clipPath: "inset(-12% 0% -12% 0%)", x: 0, opacity: 1, duration: 0.65, ease: "power3.out" }, 0.25);

        // ── Scene 2 (0.9–1.7s): tagline rises beneath, per-word stagger.
        gsap.utils.toArray("#f06-lock .f06-w").forEach((el, i) => {
          tl.fromTo(el,
            { opacity: 0, y: 28 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.9 + i * 0.07);
        });

        // ── Scene 3 (1.7–2.6s): mono URL types on (discrete-text-sequence, chunked bulk states)
        // while its accent underline draws left→right (svg-path-draw).
        const URL_SEQ = [
          { t: 0.0, text: "" },
          { t: 1.72, text: "mass" },
          { t: 1.78, text: "massimil" },
          { t: 1.84, text: "massimiliano" },
          { t: 1.92, text: "massimilianolapuma" },
          { t: 2.02, text: "massimilianolapuma." },
          { t: 2.08, text: "massimilianolapuma.github" },
          { t: 2.16, text: "massimilianolapuma.github.io" },
          { t: 2.24, text: "massimilianolapuma.github.io/" },
          { t: 2.32, text: "massimilianolapuma.github.io/cube" },
          { t: 2.40, text: "massimilianolapuma.github.io/cubelite" },
        ];
        function urlAt(time) {
          for (let i = URL_SEQ.length - 1; i >= 0; i--) {
            if (time >= URL_SEQ[i].t) return URL_SEQ[i].text;
          }
          return "";
        }
        const urlText = document.getElementById("f06-url-text");
        const cursor = document.getElementById("f06-cursor");
        urlText.textContent = "";
        cursor.style.opacity = "0";
        const CURSOR_ON = 1.55, CURSOR_OFF = 2.62;
        const driver = { t: 0 };
        tl.to(driver, {
          t: TOTAL, duration: TOTAL, ease: "none",
          onUpdate: () => {
            const t = driver.t;
            urlText.textContent = urlAt(t);
            // Deterministic square-wave blink (~0.6s cycle), solid while keys are landing.
            const typing = t >= 1.72 && t < 2.46;
            const blinkOn = Math.sin((t - CURSOR_ON) * Math.PI * 2 / 0.6 + Math.PI / 2) > 0;
            const visible = t >= CURSOR_ON && t < CURSOR_OFF && (typing || blinkOn);
            cursor.style.opacity = visible ? "1" : "0";
          },
        }, 0);

        const underline = document.getElementById("f06-underline-path");
        const len = underline.getTotalLength();
        underline.style.strokeDasharray = `${len}`;
        underline.style.strokeDashoffset = `${len}`;
        tl.fromTo(underline,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 1.8);

        // ── Scene 4 (2.6–3.4s): held end card. A barely-perceptible push across the whole card
        // keeps the hold alive without adding a second development phase.
        tl.fromTo("#f06-lock", { scale: 1 }, { scale: 1.015, duration: 3.4, ease: "none" }, 0);

        // ── Scene 5 (3.4–4.0s): film exit — card, then grid + hairlines + chrome, fade to plain #0F172A.
        tl.fromTo("#f06-lock", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power2.inOut", immediateRender: false }, 3.4);
        tl.fromTo("#f06-grid", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power2.inOut", immediateRender: false }, 3.45);
      })();
