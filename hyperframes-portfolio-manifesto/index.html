  <head>

    <style>
      /* Fonts — same families as ../styles.css (Manrope, DM Mono).
         Gelasio italic = open-source, Georgia-metric stand-in for the site's <em> (Georgia). */
      @font-face { font-family: "Manrope"; src: url("assets/fonts/manrope-latin-300-normal.woff2") format("woff2"); font-weight: 300; font-style: normal; }
      @font-face { font-family: "Manrope"; src: url("assets/fonts/manrope-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-style: normal; }
      @font-face { font-family: "Manrope"; src: url("assets/fonts/manrope-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-style: normal; }
      @font-face { font-family: "DM Mono"; src: url("assets/fonts/dm-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "DM Mono"; src: url("assets/fonts/dm-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-style: normal; }
      @font-face { font-family: "Gelasio"; src: url("assets/fonts/gelasio-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }

      /* Palette — tokens from ../styles.css */
      :root {
        --ink: #12110f;
        --paper: #f3f0e9;
        --acid: #c9ff31;
        --orange: #ff6337;
        --muted: #77736d;
        --muted-text: #6b6761; /* --muted darkened for small video labels (AA on paper) */
        --rule: #c9c4bc;
        --shade: #e4dfd4;
        --shade-deep: #d2ccbf;
        --shadow: rgba(18, 17, 15, 0.16);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: "Manrope", sans-serif;
      }
      .layer { position: absolute; inset: 0; }

      /* ── Grid (120px module) ── */
      #grid-wrap { position: absolute; inset: 0; }
      .g-v { position: absolute; top: 0; width: 1px; height: 1080px; background: var(--ink); opacity: 0.16; }
      .g-h { position: absolute; left: 0; width: 1920px; height: 1px; background: var(--ink); opacity: 0.16; }
      .g-v.major, .g-h.major { opacity: 0.32; }
      .g-x { position: absolute; width: 22px; height: 22px; }
      .g-x::before, .g-x::after { content: ""; position: absolute; background: var(--ink); }
      .g-x::before { left: 10px; top: 0; width: 2px; height: 22px; }
      .g-x::after { left: 0; top: 10px; width: 22px; height: 2px; }

      /* ── Chrome (persistent, matches site header + section labels) ── */
      .brand {
        position: absolute; left: 120px; top: 0; height: 120px;
        display: flex; align-items: center;
        font: 500 30px "DM Mono", monospace; letter-spacing: -0.08em;
      }
      .counter {
        position: absolute; right: 120px; top: 0; height: 120px;
        display: flex; align-items: center; gap: 12px;
        font: 500 22px "DM Mono", monospace; letter-spacing: 0.06em; color: var(--muted-text);
      }
      .count-stack { position: relative; display: block; width: 32px; height: 32px; overflow: hidden; color: var(--ink); }
      .count { position: absolute; left: 0; top: 0; display: block; line-height: 32px; }
      .count.later { opacity: 0; visibility: hidden; }
      .rail { position: absolute; left: 120px; right: 120px; top: 1019px; height: 2px; background: var(--rule); }
      .rail-fill { position: absolute; inset: 0; background: var(--ink); transform-origin: left center; }
      .noise {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.05;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
      }

      /* ── Shared type ── */
      .scene-content {
        width: 100%; height: 100%;
        display: flex; flex-direction: column;
        padding: 120px 120px;
      }
      .display { font-weight: 800; letter-spacing: -0.065em; line-height: 0.92; }
      .mask { display: block; overflow: hidden; padding: 0.03em 0.1em 0.13em 0; }
      .mask + .mask { margin-top: -0.14em; }
      .mask-in { display: block; white-space: nowrap; }

      /* Scene 1 */
      .s1-content { justify-content: flex-end; padding-bottom: 200px; }
      .s1-content .display { font-size: 300px; }
      .dot { display: block; width: 22px; height: 22px; border-radius: 50%; background: var(--orange); margin: 0 0 36px 4px; }

      /* Scene 2 */
      .s2-content { justify-content: center; }
      .w { display: block; width: fit-content; font-size: 138px; font-weight: 800; letter-spacing: -0.065em; line-height: 1.02; padding: 0 0.12em 0.06em 0; white-space: nowrap; }
      .sl { font-weight: 300; color: var(--orange); }
      .node {
        position: absolute; width: 240px; height: 240px;
        background: var(--paper); border: 2px solid var(--ink);
      }
      .node-ai { background: var(--orange); }
      .nlabel { position: absolute; left: 18px; top: 14px; font: 500 20px "DM Mono", monospace; color: var(--muted-text); }
      .node-ai .nlabel { color: var(--ink); }
      .glyph { position: absolute; right: 26px; bottom: 26px; }
      .g-circle { width: 64px; height: 64px; border: 3px solid var(--ink); border-radius: 50%; }
      .g-diamond { width: 46px; height: 46px; border: 3px solid var(--ink); transform: rotate(45deg); right: 34px; bottom: 34px; }
      .g-bars { width: 72px; height: 34px; border-top: 10px solid var(--ink); border-bottom: 10px solid var(--ink); }
      .g-star { width: 64px; height: 64px; background: var(--ink); clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); }
      .conn { position: absolute; background: var(--ink); }
      .conn-h { height: 3px; }
      .conn-v { width: 3px; }
      .port { position: absolute; width: 12px; height: 12px; background: var(--orange); border: 2px solid var(--ink); }

      /* Scene 3 */
      .s3-content { justify-content: center; padding-bottom: 160px; }
      .s3-content .display { font-size: 230px; }
      .ch { display: inline-block; }
      .sub { display: block; margin-top: 22px; font: 500 46px "DM Mono", monospace; letter-spacing: -0.02em; white-space: nowrap; }

      .cube-shadow {
        position: absolute; left: 1250px; top: 735px; width: 460px; height: 70px; border-radius: 50%;
        background: radial-gradient(closest-side, var(--shadow), transparent);
      }
      .cube-stage { position: absolute; left: 1320px; top: 360px; width: 320px; height: 320px; perspective: 1800px; }
      .cube-move, .cube-tilt, .cube, .fr { position: absolute; inset: 0; transform-style: preserve-3d; }
      .cube-tilt { transform: rotateX(-24deg); }
      .face {
        position: absolute; inset: 0;
        border: 3px solid var(--ink);
        background-color: var(--paper);
        background-image:
          linear-gradient(var(--rule), var(--rule)),
          linear-gradient(var(--rule), var(--rule));
        background-size: 2px 100%, 100% 2px;
        background-position: center, center;
        background-repeat: no-repeat;
      }
      .f-side { background-color: var(--shade); }
      .f-deep { background-color: var(--shade-deep); }

      /* Scene 4 */
      .s4-content { justify-content: flex-end; padding-bottom: 300px; }
      .s4-content .display { font-size: 228px; }
      .s4-content em { font-family: "Gelasio", serif; font-style: italic; font-weight: 400; letter-spacing: -0.02em; display: inline-block; margin-left: 0.06em; }
      .rule { position: absolute; left: 120px; top: 839px; width: 1640px; height: 3px; background: var(--ink); transform-origin: left center; }
      .square { position: absolute; left: 1760px; top: 820px; width: 40px; height: 40px; background: var(--acid); border: 3px solid var(--ink); }
    </style>
  </head>

    <script>
      // ── Build the 120px grid (deterministic) ──
      const gridWrap = document.getElementById("grid-wrap");
      const vLines = [];
      const hLines = [];
      const crosses = [];
      for (let col = 1; col <= 15; col++) {
        const el = document.createElement("div");
        el.className = "g-v" + (col % 4 === 0 ? " major" : "");
        el.style.left = col * 120 + "px";
        gridWrap.appendChild(el);
        vLines.push(el);
      }
      for (let row = 1; row <= 8; row++) {
        const el = document.createElement("div");
        el.className = "g-h" + (row % 4 === 0 ? " major" : "");
        el.style.top = row * 120 + "px";
        gridWrap.appendChild(el);
        hLines.push(el);
      }
      [[4, 4], [8, 4], [12, 4], [4, 8], [8, 8], [12, 8]].forEach(([col, row]) => {
        const el = document.createElement("div");
        el.className = "g-x";
        el.style.left = col * 120 - 10 + "px";
        el.style.top = row * 120 - 10 + "px";
        gridWrap.appendChild(el);
        crosses.push(el);
      });

      const acid = getComputedStyle(document.documentElement).getPropertyValue("--acid").trim();
      const tl = gsap.timeline({ paused: true });

      // ── Chrome ──
      tl.fromTo("#rail-fill", { scaleX: 0 }, { scaleX: 1, duration: 11, ease: "none" }, 0.2);
      function swapCount(from, to, t, immediate = true) {
        tl.to(from, { yPercent: -100, autoAlpha: 0, duration: 0.3, ease: "power2.in" }, t);
        tl.fromTo(to, { yPercent: 100, autoAlpha: 0 }, { yPercent: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out", immediateRender: immediate }, t + 0.12);
      }
      swapCount("#c1", "#c2", 3.0);
      swapCount("#c2", "#c3", 6.0);
      swapCount("#c3", "#c4", 9.0);

      // ── ① Grid emerges, "Designing systems" ──
      vLines.forEach((el, i) => gsap.set(el, { transformOrigin: i % 2 ? "50% 100%" : "50% 0%" }));
      hLines.forEach((el, i) => gsap.set(el, { transformOrigin: i % 2 ? "100% 50%" : "0% 50%" }));
      tl.fromTo(vLines, { scaleY: 0 }, { scaleY: 1, duration: 1.1, ease: "expo.out", stagger: { each: 0.03, from: "center" } }, 0.2);
      tl.fromTo(hLines, { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power3.out", stagger: { each: 0.04, from: "center" } }, 0.45);
      tl.fromTo(crosses, { autoAlpha: 0, rotation: -90, scale: 0.4 }, { autoAlpha: 1, rotation: 0, scale: 1, duration: 0.5, ease: "back.out(2)", stagger: 0.05 }, 1.1);
      tl.fromTo("#s1-dot", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, 0.9);
      tl.fromTo("#s1-l1", { yPercent: 110 }, { yPercent: 0, duration: 0.95, ease: "power4.out" }, 1.05);
      tl.fromTo("#s1-l2", { yPercent: 110 }, { yPercent: 0, duration: 0.95, ease: "power4.out" }, 1.2);
      tl.to(["#s1-l1", "#s1-l2"], { yPercent: -110, duration: 0.38, ease: "power3.in", stagger: 0.06 }, 2.72);
      tl.to("#s1-dot", { scale: 0, duration: 0.25, ease: "power2.in" }, 2.75);

      // ── ② Grid → modules + connections, "Cloud / DevSecOps / Full stack / AI" ──
      tl.to("#grid-wrap", { opacity: 0.45, duration: 0.8, ease: "sine.inOut" }, 3.0);
      const beats2 = [3.2, 3.65, 4.1, 4.55];
      ["#w1", "#w2", "#w3", "#w4"].forEach((w, i) => {
        tl.fromTo(w, { clipPath: "inset(0% 100% 0% 0%)", x: -24 }, { clipPath: "inset(0% 0% 0% 0%)", x: 0, duration: 0.6, ease: "power3.out" }, beats2[i]);
        tl.fromTo("#n" + (i + 1), { scale: 0.6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.6, ease: "expo.out" }, beats2[i] - 0.05);
      });
      const links = [
        { id: "#k12", prop: "scaleX", origin: "0% 50%", ports: ["#p12a", "#p12b"], t: 3.8 },
        { id: "#k13", prop: "scaleY", origin: "50% 0%", ports: ["#p13a", "#p13b"], t: 4.25 },
        { id: "#k24", prop: "scaleY", origin: "50% 0%", ports: ["#p24a", "#p24b"], t: 4.7 },
        { id: "#k34", prop: "scaleX", origin: "100% 50%", ports: ["#p34a", "#p34b"], t: 4.78 },
      ];
      links.forEach(({ id, prop, origin, ports, t }) => {
        tl.fromTo(id, { [prop]: 0, transformOrigin: origin }, { [prop]: 1, duration: 0.45, ease: "power2.inOut" }, t);
        tl.fromTo(ports[0], { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2.5)" }, t - 0.05);
        tl.fromTo(ports[1], { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2.5)" }, t + 0.38);
      });
      const allPorts = links.flatMap((l) => l.ports);
      tl.to(allPorts, { scale: 1.6, duration: 0.22, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.04 }, 5.2);
      tl.to(["#w1", "#w2", "#w3", "#w4"], { clipPath: "inset(0% 0% 0% 100%)", duration: 0.35, ease: "power3.in", stagger: 0.05 }, 5.7);
      tl.to(["#k12", "#k13", "#k24", "#k34", ...allPorts], { autoAlpha: 0, duration: 0.2, ease: "power1.in" }, 5.72);
      // nodes condense toward the cube's center (1480, 520)
      [["#n1", 160, 160], ["#n2", -200, 160], ["#n3", 160, -200], ["#n4", -200, -200]].forEach(([n, dx, dy]) => {
        tl.to(n, { x: dx, y: dy, scale: 0.35, autoAlpha: 0, duration: 0.5, ease: "power3.inOut" }, 5.75);
      });

      // ── ③ Cube assembles, "Cubelite — in development" ──
      tl.fromTo("#cube", { rotationY: 15 }, { rotationY: 75, duration: 3.0, ease: "sine.inOut" }, 6.0);
      tl.fromTo(
        ["#f-bottom", "#f-back", "#f-left", "#f-right", "#f-front", "#f-top"],
        { z: 440, autoAlpha: 0 },
        { z: 160, autoAlpha: 1, duration: 0.9, ease: "expo.out", stagger: 0.07 },
        6.05,
      );
      tl.to("#f-top", { backgroundColor: acid, duration: 0.5, ease: "power2.out" }, 7.0);
      tl.fromTo("#cube-shadow", { scaleX: 0.3, autoAlpha: 0 }, { scaleX: 1, autoAlpha: 1, duration: 0.9, ease: "power2.out" }, 6.3);
      tl.fromTo("#s3-title .ch", { yPercent: 110 }, { yPercent: 0, duration: 0.8, ease: "power4.out", stagger: 0.035 }, 6.45);
      tl.fromTo("#s3-sub", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.7, ease: "power2.out" }, 7.05);
      tl.to("#s3-title", { yPercent: -110, duration: 0.32, ease: "power2.in" }, 8.7);
      tl.to("#s3-sub", { autoAlpha: 0, duration: 0.25, ease: "power1.in" }, 8.72);

      // ── ④ Cube → acid square, "Making the next step possible." ──
      tl.to("#cube-move", { x: 300, y: 320, scale: 0.125, duration: 0.75, ease: "power3.inOut" }, 9.0);
      tl.to("#cube", { rotationY: 135, duration: 0.75, ease: "power3.inOut" }, 9.0);
      tl.to("#cube-move", { autoAlpha: 0, duration: 0.18, ease: "power1.in" }, 9.62);
      tl.to("#cube-shadow", { autoAlpha: 0, duration: 0.3, ease: "power1.in" }, 9.0);
      tl.fromTo("#s4-square", { scale: 0, rotation: 45 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.6)" }, 9.6);
      tl.to("#grid-wrap", { opacity: 0.8, duration: 1.0, ease: "sine.inOut" }, 9.2);
      tl.fromTo("#s4-l1", { yPercent: 110 }, { yPercent: 0, duration: 1.0, ease: "expo.out" }, 9.3);
      tl.fromTo("#s4-l2", { yPercent: 110 }, { yPercent: 0, duration: 1.0, ease: "expo.out" }, 9.46);
      tl.fromTo("#s4-em", { x: 48, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 1.1, ease: "power2.out" }, 9.62);
      tl.fromTo("#s4-rule", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power2.inOut" }, 9.95);

      // ── Dissolve back to blank paper (= frame 0, loopable) ──
      tl.to("#s4-wrap", { autoAlpha: 0, duration: 0.75, ease: "power1.inOut" }, 11.2);
      tl.to("#grid-wrap", { opacity: 0, duration: 0.75, ease: "sine.inOut" }, 11.2);
      tl.to("#rail-fill", { autoAlpha: 0, duration: 0.6, ease: "power1.in" }, 11.2);
      swapCount("#c4", "#c1", 11.3, false);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
